name: Unified mobile UX
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/e2e/unified-mobile.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/unified-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/e2e/unified-mobile.spec.ts'
      - 'playwright.config.ts'
jobs:
  mobile-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Test unified map on iOS and Android
        run: npx playwright test tests/e2e/unified-mobile.spec.ts --config=playwright.extended.config.ts --reporter=line --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-mobile-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
