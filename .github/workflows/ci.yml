name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Active service worker syntax guard
        run: node --check public/sw.js

      - name: API + React build verification
        run: npm test

      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Mobile device emulation tests
        run: npm run test:mobile

      - name: Upload mobile test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
