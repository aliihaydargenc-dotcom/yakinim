name: Apply YKN Sprint 1

on:
  push:
    branches: [codex/ykn-sprint1]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ykn-sprint1-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/ykn-sprint1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply integration
        run: node scripts/apply-ykn-sprint1.mjs

      - name: Verify
        run: npm test

      - name: Remove one-shot integration files
        run: rm scripts/apply-ykn-sprint1.mjs .github/workflows/ykn-sprint1-apply.yml

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate YKN Sprint 1 [ykn-sprint1-applied]"
          git push origin HEAD:codex/ykn-sprint1
