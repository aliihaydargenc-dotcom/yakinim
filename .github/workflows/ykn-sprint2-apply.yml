name: Apply YKN Sprint 2

on:
  push:
    branches: [codex/ykn-sprint2-route]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ykn-sprint2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ykn-sprint2-route
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration
        run: node scripts/apply-ykn-sprint2.mjs
      - name: Verify
        run: npm test
      - name: Remove one-shot files
        run: rm scripts/apply-ykn-sprint2.mjs .github/workflows/ykn-sprint2-apply.yml
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate YKN Sprint 2 [ykn-sprint2-applied]"
          git push origin HEAD:codex/ykn-sprint2-route
