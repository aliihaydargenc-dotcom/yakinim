<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A sleek sliding puzzle game built with pure HTML, CSS, and JavaScript. Powered by OpenClaw.">
  <title>15 Bulmacası</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>🧩 15 Bulmacası</h1>
  <p class="subtitle">Taşları sırayla diz</p>

  <div class="controls">
    <select id="difficulty">
      <option value="3">3×3 Kolay</option>
      <option value="4" selected>4×4 Klasik</option>
      <option value="5">5×5 Zor</option>
    </select>
    <button onclick="shuffle()">Karıştır</button>
    <button onclick="resetGame()">Sıfırla</button>
  </div>

  <div class="stats">
    <div><span>Hamle:</span> <strong id="moves">0</strong></div>
    <div><span>Süre:</span> <strong id="timer">0:00</strong></div>
    <div><span>Rekor:</span> <strong id="best">—</strong></div>
  </div>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <div class="win-overlay" id="winOverlay">
    <h2>Tebrikler!</h2>
    <p id="winMsg">Solved in 0 moves and 0:00</p>
    <button onclick="closeWin()">Tekrar oyna</button>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
