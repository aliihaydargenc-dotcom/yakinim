<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Engel Atlama</title><link rel="stylesheet" href="../common.css"><style>
.arcade{display:block;width:min(100%,410px);aspect-ratio:2/3;margin:0 auto;border-radius:15px;border:1px solid #b8c8d9;background:#e7eff8;touch-action:manipulation}
.help{text-align:center;font-size:12px;color:#64758b}
</style></head><body><main class="app">
<div class="head"><div><h1>Engel Atlama</h1><p class="sub">Engellerin üzerinden zamanında atla.</p></div><div class="metrics"><div class="metric"><strong id="score">0</strong><span>Puan</span></div><div class="metric"><strong id="best">0</strong><span>Rekor</span></div></div></div>
<canvas id="board" class="arcade" width="360" height="540" aria-label="Engel Atlama oyun alanı"></canvas>
<div class="controls"><button class="primary" id="start">Başlat</button><button class="secondary" id="reset">Yeni koşu</button><span class="notice" id="status" role="status" aria-live="polite"></span></div>
<p class="help">Ekrana dokun veya boşluk tuşuna basarak zıpla.</p></main>
<script>
'use strict';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),W=360,H=540,ground=466;
let best=0,score=0,playing=false,over=false,elapsed=0,spawn=1.2,last=0,frame=0,speed=180,player,obstacles=[];
try{best=Number(localStorage.getItem('yakinim:runner:best')||0)||0;}catch{}
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);}
new ResizeObserver(resize).observe(canvas);resize();
function reset(){score=0;elapsed=0;speed=180;spawn=1.0;over=false;playing=false;obstacles=[];player={x:66,y:ground-38,w:31,h:38,vy:0};refresh();draw();}
function saveBest(){try{localStorage.setItem('yakinim:runner:best',String(best));}catch{}}
function refresh(){document.getElementById('score').textContent=score;document.getElementById('best').textContent=best;document.getElementById('status').textContent=over?'Koşu bitti':playing?'Koşuyorsun':'Hazır';document.getElementById('start').textContent=over?'Yeniden başla':playing?'Duraklat':'Başlat';}
function start(){if(over)reset();playing=!playing;refresh();}
function jump(){if(!playing){if(over)reset();playing=true;refresh();}if(player.y+player.h>=ground-1){player.vy=-570;}}
function update(dt){
 elapsed+=dt;speed=Math.min(355,180+elapsed*3.1);
 player.vy+=1550*dt;player.y+=player.vy*dt;
 if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;}
 spawn-=dt;if(spawn<=0){let h=28+Math.random()*29;obstacles.push({x:W+22,y:ground-h,w:22+Math.random()*13,h});
 spawn=Math.max(.75,1.5-Math.min(.55,elapsed*.007))+Math.random()*.32;}
 for(const o of obstacles)o.x-=speed*dt;
 obstacles=obstacles.filter(o=>o.x+o.w>-20);
 for(const o of obstacles)if(player.x+player.w-7>o.x&&player.x+7<o.x+o.w&&player.y+player.h-5>o.y&&player.y+5<o.y+o.h){playing=false;over=true;saveBest();refresh();break;}
 score=Math.floor(elapsed*10);
 if(score>best)best=score;
 document.getElementById('score').textContent=score;document.getElementById('best').textContent=best;
}
function fillRound(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function draw(){
 const gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'#d6e7f6');gradient.addColorStop(1,'#f7f8fc');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#d4e1ed';for(let i=0;i<6;i++){let x=(i*93-(elapsed*speed*.24)%93+W)%W;ctx.beginPath();ctx.arc(x,89+i%3*43,15+i%3*5,0,Math.PI*2);ctx.fill();}
 ctx.fillStyle='#a9bec9';ctx.fillRect(0,ground,W,6);
 ctx.fillStyle='#dfe8ec';ctx.fillRect(0,ground+6,W,H-ground-6);
 ctx.fillStyle='#345b7a';ctx.font='bold 14px system-ui';ctx.fillText('ENGEL ATLAMA',14,32);
 fillRound(player.x,player.y,player.w,player.h,7,'#507ba6');
 fillRound(player.x+20,player.y+10,5,5,3,'#fff');
 for(const o of obstacles){fillRound(o.x,o.y,o.w,o.h,5,'#d58381');fillRound(o.x+5,o.y+6,Math.max(5,o.w-10),5,2,'#f3b2a0');}
 if(!playing){fillRound(47,220,266,93,16,'#fffffff0');ctx.textAlign='center';ctx.fillStyle='#345b7a';ctx.font='bold 19px system-ui';ctx.fillText(over?'Koşu sona erdi':score?'Devam etmek için dokun':'Başlamak için dokun',180,258);ctx.font='13px system-ui';ctx.fillText('Dokununca zıplarsın',180,286);ctx.textAlign='left';}
}
function loop(t){let dt=Math.min((t-last)/1000||0,.033);last=t;if(playing)update(dt);draw();frame=requestAnimationFrame(loop);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
document.getElementById('start').addEventListener('click',start);
document.getElementById('reset').addEventListener('click',reset);
window.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();if(!e.repeat)jump();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;saveBest();refresh();}});
window.addEventListener('pagehide',()=>{saveBest();cancelAnimationFrame(frame);});
reset();frame=requestAnimationFrame(loop);
</script></body></html>
