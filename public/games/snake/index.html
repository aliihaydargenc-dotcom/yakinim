<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yılan</title><link rel="stylesheet" href="mobile.css"></head><body>
<header class="hud"><div><strong id="level">Bölüm 1</strong><small id="score">0 / 5 elma</small></div><button id="pause" disabled aria-label="Oyunu duraklat">Ⅱ</button></header>
<div class="board-wrap"><canvas id="board" aria-label="Yılan oyun tahtası"></canvas><div id="overlay"><div class="overlay-card"><h2 id="title">Bölüm 1</h2><p id="message">5 elma topla</p><button id="start">Başla</button><div id="levels" hidden></div></div></div></div>
<div class="status"><span id="status">Rekor 0</span><button id="chapters">Bölümler</button></div>
<div class="controls"><button data-dir="0,-1" aria-label="Yukarı">↑</button><button data-dir="-1,0" aria-label="Sola">←</button><button data-dir="0,1" aria-label="Aşağı">↓</button><button data-dir="1,0" aria-label="Sağa">→</button></div>
<script src="game.js"></script></body></html>
